<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>My Bootstrap Page</title>
      <!-- Bootstrap CSS via CDN -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Title</title>
</head>
<body classs="bg-light">
      <div class="container">
        <h1>Hello, Bootstrap! 001</h1>
        <button class="btn btn-primary">Click me</button>
      </div>
    <div class="container mt-5">
        <div class="card text-center">
          <div class="card-header">
            System Date and Time
          </div>
          <div class="card-body">
            <h5 class="card-title" id="datetime">Loading...</h5>
            <p class="card-text">This shows your current system time.</p>
          </div>
        </div>
    </div>

  <script>
    function updateDateTime() {
      const now = new Date();
      const options = {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true // Set to false for 24-hour format
      };
      const formatted = now.toLocaleString('en-IN', options);
      document.getElementById('datetime').textContent = formatted;
    }

    updateDateTime(); // Initial call
    setInterval(updateDateTime, 60000); // Update every minute

  </script>

      <!-- Bootstrap JS via CDN (optional, for interactive components) -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script
</body>
</html>
